<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dress-Up Adventure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;color:#fff;overflow-x:hidden}
.header{text-align:center;padding:20px 10px 10px;background:rgba(0,0,0,.3);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.header h1{font-size:28px;background:linear-gradient(135deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{font-size:13px;color:#8899aa;margin-top:2px}
.layout{display:flex;gap:15px;padding:15px;max-width:1300px;margin:0 auto;min-height:calc(100vh - 90px)}
.topic-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 10px;background:rgba(255,255,255,.05);margin:0 15px;border-radius:12px}
.topic-btn{padding:6px 16px;border-radius:20px;border:2px solid transparent;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;background:rgba(255,255,255,.08);color:#aab}
.topic-btn:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
.topic-btn.active{border-color:#ffd200;background:rgba(255,210,0,.15);color:#ffd200;box-shadow:0 0 20px rgba(255,210,0,.15)}
.char-area{flex:1;display:flex;flex-direction:column;align-items:center;min-width:300px}
.char-card{background:rgba(255,255,255,.06);border-radius:20px;padding:20px;position:relative;width:100%;max-width:380px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.char-frame{position:relative;width:220px;height:320px}
.base-char{position:absolute;inset:0}
.base-char .head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:80px;height:80px;background:linear-gradient(135deg,#f5d0b8,#e8b89a);border-radius:50%;z-index:1}
.base-char .face{position:absolute;inset:0}
.base-char .eye{position:absolute;width:8px;height:10px;background:#2d1810;border-radius:50%;top:32px}
.base-char .eye.l{left:20px}
.base-char .eye.r{right:20px}
.base-char .mouth{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:16px;height:8px;border:2px solid #c47070;border-top:none;border-radius:0 0 12px 12px}
.base-char .blush{position:absolute;width:14px;height:8px;background:rgba(255,150,150,.35);border-radius:50%;top:42px}
.base-char .blush.l{left:8px}
.base-char .blush.r{right:8px}
.base-char .body{position:absolute;top:72px;left:50%;transform:translateX(-50%);width:70px;height:85px;background:linear-gradient(180deg,#f5d0b8,#e8b89a);border-radius:12px 12px 8px 8px;z-index:0}
.base-char .arm{position:absolute;width:14px;height:65px;background:linear-gradient(180deg,#f0c8a8,#e0b090);border-radius:7px;top:78px}
.base-char .arm.l{left:17px;transform:rotate(-10deg)}
.base-char .arm.r{right:17px;transform:rotate(10deg)}
.base-char .leg{position:absolute;width:18px;height:70px;background:linear-gradient(180deg,#e0b090,#d0a080);border-radius:9px;top:152px}
.base-char .leg.l{left:68px}
.base-char .leg.r{right:68px}
.base-char .foot{position:absolute;width:22px;height:10px;background:#d0a080;border-radius:5px;top:217px}
.base-char .foot.l{left:65px}
.base-char .foot.r{right:65px}
.item-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.item-slot{position:absolute;transition:all .3s ease;opacity:0;transform:scale(.85)}
.item-slot.equipped{opacity:1;transform:scale(1)}
.item-slot .emoji{display:block;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.item-slot .label{display:none}
.item-slot.slot-hat{top:-12px;left:50%;transform:translateX(-50%) scale(.85)}
.item-slot.slot-hat.equipped{transform:translateX(-50%) scale(1)}
.item-slot.slot-hat .emoji{font-size:44px}
.item-slot.slot-eyewear{top:28px;left:50%;transform:translateX(-50%) scale(.85)}
.item-slot.slot-eyewear.equipped{transform:translateX(-50%) scale(1)}
.item-slot.slot-eyewear .emoji{font-size:36px}
.item-slot.slot-top{top:54px;left:50%;transform:translateX(-50%) scale(.85);width:190px;height:110px}
.item-slot.slot-top.equipped{transform:translateX(-50%) scale(1)}
.item-slot.slot-top .cloth-piece{width:100%;height:100%;border-radius:18px 18px 10px 10px;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.item-slot.slot-top .cloth-piece::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25) 0%,transparent 50%);border-radius:inherit;pointer-events:none}
.item-slot.slot-bottom{top:148px;left:50%;transform:translateX(-50%) scale(.85);width:120px;height:80px}
.item-slot.slot-bottom.equipped{transform:translateX(-50%) scale(1)}
.item-slot.slot-bottom .cloth-piece{width:100%;height:100%;border-radius:8px 8px 14px 14px;display:flex;align-items:center;justify-content:center;font-size:34px;border:3px solid;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.item-slot.slot-bottom .cloth-piece::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,transparent 40%);border-radius:inherit;pointer-events:none}
.char-frame.has-top .base-char .body,
.char-frame.has-top .base-char .arm{display:none}
.char-frame.has-bottom .base-char .leg{display:none}
.item-slot.slot-shoes .emoji{font-size:32px}
.item-slot.slot-shoes{top:208px;left:50%;transform:translateX(-50%) scale(.85)}
.item-slot.slot-shoes.equipped{transform:translateX(-50%) scale(1)}
.item-slot.slot-acc1{top:90px;left:-12px;transform:scale(.85)}
.item-slot.slot-acc1.equipped{transform:scale(1)}
.item-slot.slot-acc1 .emoji{font-size:32px}
.item-slot.slot-acc2{top:85px;right:-14px;transform:scale(.85)}
.item-slot.slot-acc2.equipped{transform:scale(1)}
.item-slot.slot-acc2 .emoji{font-size:36px}
.panel{width:290px;flex-shrink:0}
.panel-card{background:rgba(255,255,255,.06);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.panel-card h3{font-size:14px;color:#aab;margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.cat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.cat-tab{padding:4px 10px;border-radius:12px;border:none;cursor:pointer;font-size:11px;font-weight:600;transition:all .2s;background:rgba(255,255,255,.08);color:#889}
.cat-tab:hover{background:rgba(255,255,255,.14);color:#bbc}
.cat-tab.active{background:#ffd200;color:#1a1a2e}
.items-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item-btn{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;transition:all .2s;border:2px solid transparent;user-select:none}
.item-btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.item-btn.equipped{border-color:#ffd200;background:rgba(255,210,0,.12);box-shadow:0 0 12px rgba(255,210,0,.1)}
.item-btn .emoji{font-size:28px;display:block}
.item-btn .iname{font-size:10px;color:#99a;margin-top:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-btn .color-swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:middle;border:1px solid rgba(255,255,255,.2)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{flex:1;padding:8px 12px;border-radius:10px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;min-width:70px}
.btn-random{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-random:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(102,126,234,.4)}
.btn-clear{background:rgba(255,255,255,.1);color:#aab}
.btn-clear:hover{background:rgba(255,255,255,.16)}
.btn-share{background:linear-gradient(135deg,#f7971e,#ffd200);color:#1a1a2e}
.btn-share:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(255,210,0,.3)}
.empty-msg{color:#667;font-size:12px;text-align:center;padding:12px 0;grid-column:1/-1}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}
.toast.show{opacity:1}
@media(max-width:820px){.layout{flex-direction:column;align-items:center}.panel{width:100%;max-width:400px}.char-card{max-width:320px}}
@media(max-width:500px){.header h1{font-size:22px}.topic-btn{font-size:11px;padding:4px 12px}.items-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

const CAT_NAMES={hat:'🧢 Headwear',eyewear:'👓 Eyewear',top:'👕 Tops',bottom:'👖 Bottoms',shoes:'👟 Shoes',acc1:'✋ Hold Item',acc2:'🎒 Back Item'};
const CAT_ORDER=['hat','eyewear','top','bottom','shoes','acc1','acc2'];

let currentTopic='fantasy';
let currentCat='hat';
let outfit={};

function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.classList.add('show');
    clearTimeout(t._hide);
    t._hide=setTimeout(()=>t.classList.remove('show'),2000);
}

function renderTopics(){
    const bar=document.getElementById('topicBar');
    bar.innerHTML=TOPICS.map(t=>
        `<button class="topic-btn${t.id===currentTopic?' active':''}" onclick="selectTopic('${t.id}')">${t.icon} ${t.label}</button>`
    ).join('');
}

function selectTopic(id){
    currentTopic=id;
    renderTopics();
    outfit={};
    renderCats();
    renderItems();
    renderChar();
    showToast(`Switched to ${TOPICS.find(t=>t.id===id).label}`);
}

function renderCats(){
    const tabs=document.getElementById('catTabs');
    const items=ITEMS[currentTopic];
    tabs.innerHTML=CAT_ORDER.filter(c=>items[c]).map(c=>
        `<button class="cat-tab${c===currentCat?' active':''}" onclick="selectCat('${c}')">${CAT_NAMES[c]||c}</button>`
    ).join('');
    document.getElementById('catTitle').textContent=CAT_NAMES[currentCat]||currentCat;
}

function selectCat(cat){
    currentCat=cat;
    renderCats();
    renderItems();
}

function renderItems(){
    const grid=document.getElementById('itemsGrid');
    const items=ITEMS[currentTopic][currentCat];
    if(!items||!items.length){
        grid.innerHTML='<div class="empty-msg">No items here yet</div>';
        return;
    }
    const isCloth=currentCat==='top'||currentCat==='bottom';
    grid.innerHTML=items.map((item,i)=>{
        const key=`${currentCat}-${i}`;
        const eq=outfit[currentCat]===key;
        let extra='';
        if(isCloth&&item.c){
            extra=` <span class="color-swatch" style="background:${item.c[0]}"></span>`;
        }
        return `<div class="item-btn${eq?' equipped':''}" onclick="toggleItem('${currentCat}',${i})">
            <span class="emoji">${item.e}</span>
            <span class="iname">${extra}${item.n}</span>
        </div>`;
    }).join('');
}

function toggleItem(cat,idx){
    const key=`${cat}-${idx}`;
    if(outfit[cat]===key){
        delete outfit[cat];
    } else {
        outfit[cat]=key;
    }
    renderItems();
    renderChar();
}

function renderChar(){
    const layer=document.getElementById('itemLayer');
    const frame=document.getElementById('charFrame');
    const items=ITEMS[currentTopic];
    let html='';
    let hasTop=false,hasBottom=false;
    for(const slot of SLOTS){
        const key=outfit[slot];
        let emoji='',name='',style='';
        let isCloth=false;
        if(key){
            const [cat,idx]=key.split('-');
            const item=items[cat]?.[parseInt(idx)];
            if(item){
                emoji=item.e;
                name=item.n;
                if((cat==='top'||cat==='bottom')&&item.c){
                    isCloth=true;
                    if(cat==='top') hasTop=true;
                    if(cat==='bottom') hasBottom=true;
                    const grad=item.c.join(',');
                    style=`background:linear-gradient(135deg,${item.c[0]},${item.c[1]});border-color:${item.b||item.c[0]}`;
                }
            }
        }
        if(isCloth){
            html+=`<div class="item-slot slot-${slot}${key?' equipped':''}">
                <div class="cloth-piece" style="${style}"><span class="emoji" style="font-size:36px">${emoji||''}</span></div>
            </div>`;
        } else {
            html+=`<div class="item-slot slot-${slot}${key?' equipped':''}">
                <span class="emoji">${emoji||''}</span>
                <span class="label">${name||''}</span>
            </div>`;
        }
    }
    frame.classList.toggle('has-top',hasTop);
    frame.classList.toggle('has-bottom',hasBottom);
    layer.innerHTML=html;
}

function randomOutfit(){
    const items=ITEMS[currentTopic];
    for(const slot of SLOTS){
        if(items[slot]&&items[slot].length){
            const idx=Math.floor(Math.random()*items[slot].length);
            outfit[slot]=`${slot}-${idx}`;
        }
    }
    renderItems();
    renderChar();
    showToast('🎲 Random outfit generated!');
}

function clearAll(){
    outfit={};
    renderItems();
    renderChar();
    showToast('🗑️ Cleared all items');
}

function shareOutfit(){
    const items=ITEMS[currentTopic];
    const theme=TOPICS.find(t=>t.id===currentTopic);
    let parts=[`✨ *Dress-Up Adventure - ${theme.label}* ✨`];
    let hasItems=false;
    for(const slot of SLOTS){
        const key=outfit[slot];
        if(key){
            const [cat,idx]=key.split('-');
            const item=items[cat]?.[parseInt(idx)];
            if(item){parts.push(`${item.e} ${item.n}`);hasItems=true;}
        }
    }
    if(!hasItems) parts.push('_(no items equipped yet!)_');
    const text=parts.join('\n');
    navigator.clipboard.writeText(text).then(()=>showToast('📋 Copied outfit to clipboard!')).catch(()=>showToast('📋 Select & copy the outfit text'));
}
