<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dress-Up Adventure Fixed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#1d2545;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.container{
    display:flex;
    gap:40px;
    align-items:flex-start;
}

.character-card{
    background:rgba(255,255,255,0.05);
    padding:30px;
    border-radius:20px;
}

.char-frame{
    position:relative;
    width:240px;
    height:360px;
}

/* =========================
   BASE CHARACTER
========================= */

.head{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:90px;
    height:90px;
    background:#e7c1a5;
    border-radius:50%;
    z-index:5;
}

.eye{
    position:absolute;
    width:8px;
    height:10px;
    background:#222;
    border-radius:50%;
    top:35px;
}

.eye.left{
    left:24px;
}

.eye.right{
    right:24px;
}

.blush{
    position:absolute;
    width:14px;
    height:8px;
    background:rgba(255,100,100,0.3);
    border-radius:50%;
    top:48px;
}

.blush.left{
    left:8px;
}

.blush.right{
    right:8px;
}

.mouth{
    position:absolute;
    width:18px;
    height:8px;
    border:2px solid #c76c6c;
    border-top:none;
    border-radius:0 0 12px 12px;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
}

/* BODY */

.body{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    width:92px;
    height:120px;
    background:#e7c1a5;
    border-radius:14px;
    z-index:2;
}

/* ARMS */

.arm{
    position:absolute;
    width:16px;
    height:85px;
    background:#e7c1a5;
    border-radius:10px;
    top:90px;
    z-index:1;
}

.arm.left{
    left:54px;
    transform:rotate(-8deg);
}

.arm.right{
    right:54px;
    transform:rotate(8deg);
}

/* LEGS */

.leg{
    position:absolute;
    width:20px;
    height:80px;
    background:#d9ae8c;
    border-radius:10px;
    top:190px;
}

.leg.left{
    left:88px;
}

.leg.right{
    right:88px;
}

/* FEET */

.foot{
    position:absolute;
    width:24px;
    height:12px;
    background:#d9ae8c;
    border-radius:6px;
    top:265px;
}

.foot.left{
    left:86px;
}

.foot.right{
    right:86px;
}

/* =========================
   ITEM SLOTS
========================= */

.item{
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* HAT */

.slot-hat{
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    font-size:42px;
    z-index:20;
}

/* EYEWEAR */

.slot-eyewear{
    top:28px;
    left:50%;
    transform:translateX(-50%);
    font-size:32px;
    z-index:15;
}

/* TOP */

.slot-top{
    top:78px;
    left:50%;
    transform:translateX(-50%);
    width:96px;
    height:100px;
    border-radius:16px;
    z-index:10;
}

/* BOTTOM */

.slot-bottom{
    top:170px;
    left:50%;
    transform:translateX(-50%);
    width:76px;
    height:76px;
    border-radius:12px;
    z-index:10;
}

/* SHOES */

.slot-shoes{
    top:255px;
    left:50%;
    transform:translateX(-50%);
    font-size:30px;
    z-index:15;
}

/* ACCESSORIES */

.slot-acc1{
    top:120px;
    left:25px;
    font-size:32px;
    z-index:20;
}

.slot-acc2{
    top:120px;
    right:25px;
    font-size:32px;
    z-index:20;
}

/* CLOTHES */

.cloth{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:inherit;
    border:3px solid rgba(255,255,255,0.3);
    font-size:34px;
    box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

/* =========================
   CONTROL PANEL
========================= */

.panel{
    width:320px;
}

.panel h2{
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.btn{
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

</style>
</head>

<body>

<div class="container">

    <div class="character-card">

        <div class="char-frame">

            <!-- CHARACTER -->

            <div class="head">
                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="blush left"></div>
                <div class="blush right"></div>

                <div class="mouth"></div>
            </div>

            <div class="body"></div>

            <div class="arm left"></div>
            <div class="arm right"></div>

            <div class="leg left"></div>
            <div class="leg right"></div>

            <div class="foot left"></div>
            <div class="foot right"></div>

            <!-- ITEMS -->

            <div class="item slot-hat">
                👑
            </div>

            <div class="item slot-eyewear">
                🔮
            </div>

            <div class="item slot-top">
                <div class="cloth"
                     style="background:linear-gradient(135deg,#7b2ff7,#3f0071)">
                    🧥
                </div>
            </div>

            <div class="item slot-bottom">
                <div class="cloth"
                     style="background:linear-gradient(135deg,#4facfe,#0061ff)">
                    👖
                </div>
            </div>

            <div class="item slot-shoes">
                👟
            </div>

            <div class="item slot-acc1">
                ⚔️
            </div>

            <div class="item slot-acc2">
                🛡️
            </div>

        </div>

    </div>

    <!-- CONTROL PANEL -->

    <div class="panel">

        <h2>Dress-Up Adventure</h2>

        <div class="buttons">

            <button class="btn">Fantasy</button>
            <button class="btn">Beach</button>

            <button class="btn">Professional</button>
            <button class="btn">Space</button>

            <button class="btn">Party</button>
            <button class="btn">Sporty</button>

        </div>

    </div>

</div>

</body>
</html>
